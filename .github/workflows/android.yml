name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          # Gereken bileşenleri doğrudan burada belirtiyoruz
          api-level: 29
          build-tools: 29.0.3
          ndk-version: 25.2.9519653

      - name: Install cargo-quad-apk
        run: cargo install cargo-quad-apk

      - name: Build APK
        env:
          # setup-android aksiyonu ANDROID_HOME'u otomatik ayarlar
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/25.2.9519653
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/25.2.9519653
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/25.2.9519653
        run: |
          cargo quad-apk build --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: yilan-oyunu-apk
          path: target/android-artifacts/release/*.apk
