name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 29
          build-tools: 29.0.3
          # NDK r23b (23.1.7779620) Macroquad için en sorunsuz sürümdür
          ndk-version: 23.1.7779620

      - name: Force Install Android 29 Platform
        run: |
          # sdkmanager yolunu bulup zorla yüklüyoruz
          SDK_MANAGER=$(find $ANDROID_HOME -name sdkmanager | head -n 1)
          $SDK_MANAGER --sdk_root=$ANDROID_HOME "platforms;android-29"

      - name: Install cargo-quad-apk
        run: cargo install cargo-quad-apk

      - name: Build APK
        env:
          # Değişen NDK sürümüne göre yolları güncelledik
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/23.1.7779620
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/23.1.7779620
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/23.1.7779620
        run: |
          cargo quad-apk build --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: yilan-oyunu-apk
          path: target/android-artifacts/release/*.apk
